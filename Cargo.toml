[package]
name = "nux-launcher"
version = "1.0.0"
edition = "2021"
authors = ["Antigravity Engineering"]
description = "NUX Launcher Linux - Personal Native Minecraft Launcher for Debian"
license = "GPL-3.0-or-later"

[dependencies]
# UI & GTK4
gtk4 = { version = "0.9", features = ["v4_12"] }
relm4 = { version = "0.9", features = ["macros"] }

# Async & Networking
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"

# Serialization & Database
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }

# Utilities & System
sha1 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
open = "5.3"
dirs = "5.0"
sysinfo = "0.31"
uuid = { version = "1.10", features = ["v4", "v5"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
