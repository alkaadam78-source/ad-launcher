<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222b"/>
      <stop offset="100%" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" stroke="#2d3342" stroke-width="4" filter="url(#shadow)"/>

  <!-- Minecraft Isometric Block Motif -->
  <!-- Top Face -->
  <polygon points="256,112 368,176 256,240 144,176" fill="#2d3342" stroke="#3d4455" stroke-width="3"/>
  <!-- Left Face -->
  <polygon points="144,176 256,240 256,368 144,304" fill="#1c2029" stroke="#3d4455" stroke-width="3"/>
  <!-- Right Face -->
  <polygon points="256,240 368,176 368,304 256,368" fill="#232733" stroke="#3d4455" stroke-width="3"/>

  <!-- Emerald Geometric Glyph (N / Play Crest) -->
  <path d="M 232 200 L 288 232 L 288 288 L 232 256 Z" fill="url(#accentGrad)" opacity="0.95"/>
  <polygon points="248,220 280,240 248,260" fill="#ffffff"/>
  
  <!-- Subtle Border Highlights -->
  <circle cx="256" cy="112" r="4" fill="#38bdf8"/>
  <circle cx="144" cy="176" r="4" fill="#38bdf8"/>
  <circle cx="368" cy="176" r="4" fill="#38bdf8"/>
  <circle cx="256" cy="368" r="4" fill="#10b981"/>
</svg>
