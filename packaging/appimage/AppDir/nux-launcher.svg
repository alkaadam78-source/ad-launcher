<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Filter for hard brutalist cartoon shadow -->
    <filter id="brutal-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="12" dy="12" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="small-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Background Base Badge (Neo-Brutalist Sticker Block) -->
  <!-- Hard Drop Shadow block -->
  <rect x="42" y="42" width="440" height="440" rx="36" fill="#000000" />
  
  <!-- Main Vibrant Card: Electric Cyber Yellow -->
  <rect x="30" y="30" width="440" height="440" rx="36" fill="#FFE600" stroke="#000000" stroke-width="12" />

  <!-- Cartoon Decorative Star Burst / Sparkles in corners -->
  <!-- Top Right Sparkle -->
  <path d="M 410 70 L 418 95 L 443 103 L 418 111 L 410 136 L 402 111 L 377 103 L 402 95 Z" fill="#FF0077" stroke="#000000" stroke-width="5" />
  <!-- Bottom Left Sparkle -->
  <path d="M 90 390 L 96 410 L 116 416 L 96 422 L 90 442 L 84 422 L 64 416 L 84 410 Z" fill="#00F0FF" stroke="#000000" stroke-width="4" />

  <!-- Isometric Cartoon Minecraft Block -->
  <g transform="translate(256, 215)">
    <!-- Top Face (Grass / Emerald Green) -->
    <path d="M 0 -105 L 125 -38 L 0 30 L -125 -38 Z" fill="#00FF88" stroke="#000000" stroke-width="10" stroke-linejoin="round" />
    
    <!-- Left Face (Dirt / Cyber Violet) -->
    <path d="M -125 -38 L 0 30 L 0 145 L -125 78 Z" fill="#7928CA" stroke="#000000" stroke-width="10" stroke-linejoin="round" />
    
    <!-- Right Face (Dirt Shadow / Deep Purple) -->
    <path d="M 0 30 L 125 -38 L 125 78 L 0 145 Z" fill="#4C1D95" stroke="#000000" stroke-width="10" stroke-linejoin="round" />

    <!-- Isometric Grass Drips (Cartoon Slime / Pixel drips) -->
    <path d="M -125 -38 L -90 -18 L -90 0 L -60 -15 L -60 10 L -30 -5 L -30 20 L 0 30 L 0 145 L -125 78 Z" fill="#000000" opacity="0.15" />
  </g>

  <!-- Turbo Cartoon Lightning Bolt (Punchy Pink & White with Black border) -->
  <g transform="translate(256, 210) rotate(-15)">
    <!-- Shadow -->
    <polygon points="12,-110 32,-110 -18,0 42,0 -58,130 -28,20 -78,20" fill="#000000" />
    <!-- Main Bolt -->
    <polygon points="0,-120 20,-120 -30,-10 30,-10 -70,120 -40,10 -90,10" fill="#FF0055" stroke="#000000" stroke-width="10" stroke-linejoin="miter" />
    <!-- Inner Highlight -->
    <polygon points="-5,-105 10,-105 -25,-5 20,-5 -50,85 -30,15 -70,15" fill="#FFFFFF" />
  </g>

  <!-- "AD" Chunky Cartoon Bubble/Block Text Badge -->
  <g transform="translate(130, 340)">
    <!-- Black offset background banner -->
    <rect x="8" y="8" width="240" height="88" rx="20" fill="#000000" />
    <rect x="0" y="0" width="240" height="88" rx="20" fill="#00F0FF" stroke="#000000" stroke-width="9" />
    <text x="120" y="62" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="62" fill="#000000" text-anchor="middle" letter-spacing="2">AD</text>
    <text x="116" y="58" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="62" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">AD</text>
  </g>

  <!-- "CREDIT BY ADAMDEVNOOB" Sub-banner Ribbon -->
  <g transform="translate(66, 436)">
    <rect x="4" y="4" width="370" height="34" rx="10" fill="#000000" />
    <rect x="0" y="0" width="370" height="34" rx="10" fill="#FF0055" stroke="#000000" stroke-width="5" />
    <text x="185" y="23" font-family="'Arial Black', sans-serif" font-weight="900" font-size="13" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">⚡ CREDIT BY ADAMDEVNOOB ⚡</text>
  </g>
</svg>
