<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E3D0A6"/>
      <stop offset="35%" stop-color="#D6B675"/>
      <stop offset="70%" stop-color="#B08A48"/>
      <stop offset="100%" stop-color="#78582F"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#30231D"/>
      <stop offset="40%" stop-color="#201815"/>
      <stop offset="100%" stop-color="#100D0C"/>
    </linearGradient>
    <linearGradient id="burgundy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#91445A"/>
      <stop offset="50%" stop-color="#6B2638"/>
      <stop offset="100%" stop-color="#421923"/>
    </linearGradient>
  </defs>

  <!-- Outer Baroque Flourish Frame -->
  <circle cx="60" cy="60" r="56" stroke="url(#gold-grad)" stroke-width="1.5" fill="none" opacity="0.4"/>
  <circle cx="60" cy="60" r="52" stroke="#78582F" stroke-width="1" stroke-dasharray="2,4" fill="none"/>

  <!-- Shield Body -->
  <path d="M60 16 C76 16 94 22 94 44 C94 72 74 94 60 102 C46 94 26 72 26 44 C26 22 44 16 60 16 Z" 
        fill="url(#shield-grad)" stroke="url(#gold-grad)" stroke-width="2.5"/>

  <!-- Inner Burgundy Inset -->
  <path d="M60 22 C72 22 86 28 86 46 C86 68 70 86 60 94 C50 86 34 68 34 46 C34 28 48 22 60 22 Z" 
        fill="url(#burgundy-grad)" opacity="0.65" stroke="#78582F" stroke-width="1"/>

  <!-- Crown / Coronet on Top -->
  <path d="M48 24 L52 14 L60 18 L68 14 L72 24 Z" fill="url(#gold-grad)" stroke="#78582F" stroke-width="0.8"/>
  <circle cx="52" cy="14" r="1.5" fill="#E3D0A6"/>
  <circle cx="60" cy="18" r="1.5" fill="#E3D0A6"/>
  <circle cx="68" cy="14" r="1.5" fill="#E3D0A6"/>

  <!-- AD Monogram (Artisan Chiseled) -->
  <text x="60" y="62" font-family="'Cinzel', 'Palatino', 'Georgia', serif" font-size="30" font-weight="bold" 
        fill="url(#gold-grad)" text-anchor="middle" dominant-baseline="middle" letter-spacing="1">AD</text>

  <!-- Small Stars / Diamond Accents -->
  <polygon points="60,78 62,82 66,84 62,86 60,90 58,86 54,84 58,82" fill="url(#gold-grad)"/>
</svg>
