name: AD Launcher CI & Release

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  validate:
    name: Code Quality & Unit Tests (Debian / Linux x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install System Dependencies (GTK4 & Graphics Stack)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libgl1-mesa-dev \
            libvulkan-dev \
            libsqlite3-dev \
            pkg-config \
            build-essential

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rustfmt Formatting Check
        run: cargo fmt --all -- --check

      - name: Cargo Check
        run: cargo check --all-targets --all-features

      - name: Run Test Suite
        run: cargo test --all-targets --all-features -- --nocapture

      - name: Build Release Binary
        run: cargo build --release --locked

      - name: Generate SHA256 Checksum
        run: |
          mkdir -p dist
          cp target/release/ad-launcher dist/
          cd dist
          sha256sum ad-launcher > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ad-launcher-linux-x86_64
          path: |
            dist/ad-launcher
            dist/SHA256SUMS.txt
